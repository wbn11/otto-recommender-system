<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Final-valid 候选覆盖与最终排序结果</title>
  <desc id="desc">对比 Candidate Recall@100 和 LambdaRank Recall@20 在点击、加购、购买及加权指标上的表现。</desc>
  <style>
    :root { color-scheme: light dark; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #1f2328; }
    .title { font-size: 22px; font-weight: 600; }
    .subtitle, .axis, .note { fill: #59636e; }
    .subtitle { font-size: 13px; }
    .axis, .value, .legend, .note { font-size: 12px; }
    .group { font-size: 13px; font-weight: 600; }
    .grid { stroke: #d0d7de; stroke-width: 1; }
    .frame { stroke: #8c959f; stroke-width: 1.2; }
    .candidate { fill: #f59e0b; }
    .ranker { fill: #16a34a; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .subtitle, .axis, .note { fill: #9da7b3; }
      .grid { stroke: #30363d; }
      .frame { stroke: #6e7681; }
      .candidate { fill: #fbbf24; }
      .ranker { fill: #4ade80; }
    }
  </style>

  <text class="title" x="70" y="38">Final-valid：候选覆盖与最终排序结果</text>
  <text class="subtitle" x="70" y="61">1,801,251 个独立验证 Session；纵轴为 Recall</text>

  <g class="legend" transform="translate(610 34)">
    <rect class="candidate" x="0" y="0" width="14" height="14" rx="2"/><text x="21" y="12">Candidate@100</text>
    <rect class="ranker" x="142" y="0" width="14" height="14" rx="2"/><text x="163" y="12">LambdaRank@20</text>
  </g>

  <g>
    <line class="grid" x1="80" y1="400" x2="910" y2="400"/>
    <line class="grid" x1="80" y1="336" x2="910" y2="336"/>
    <line class="grid" x1="80" y1="272" x2="910" y2="272"/>
    <line class="grid" x1="80" y1="208" x2="910" y2="208"/>
    <line class="grid" x1="80" y1="144" x2="910" y2="144"/>
    <line class="grid" x1="80" y1="80" x2="910" y2="80"/>
    <line class="frame" x1="80" y1="80" x2="80" y2="400"/>
    <line class="frame" x1="80" y1="400" x2="910" y2="400"/>

    <text class="axis" x="64" y="404" text-anchor="end">0.0</text>
    <text class="axis" x="64" y="340" text-anchor="end">0.2</text>
    <text class="axis" x="64" y="276" text-anchor="end">0.4</text>
    <text class="axis" x="64" y="212" text-anchor="end">0.6</text>
    <text class="axis" x="64" y="148" text-anchor="end">0.8</text>
    <text class="axis" x="64" y="84" text-anchor="end">1.0</text>
  </g>

  <g aria-label="Click">
    <rect class="candidate" x="170" y="235.1" width="52" height="164.9" rx="3"/>
    <rect class="ranker" x="230" y="256.3" width="52" height="143.7" rx="3"/>
    <text class="value" x="196" y="226" text-anchor="middle">.5154</text>
    <text class="value" x="256" y="247" text-anchor="middle">.4489</text>
    <text class="group" x="226" y="425" text-anchor="middle">Click</text>
  </g>

  <g aria-label="Cart">
    <rect class="candidate" x="370" y="185.4" width="52" height="214.6" rx="3"/>
    <rect class="ranker" x="430" y="199.6" width="52" height="200.4" rx="3"/>
    <text class="value" x="396" y="176" text-anchor="middle">.6707</text>
    <text class="value" x="456" y="190" text-anchor="middle">.6263</text>
    <text class="group" x="426" y="425" text-anchor="middle">Cart</text>
  </g>

  <g aria-label="Order">
    <rect class="candidate" x="570" y="110.9" width="52" height="289.1" rx="3"/>
    <rect class="ranker" x="630" y="115.2" width="52" height="284.8" rx="3"/>
    <text class="value" x="596" y="101" text-anchor="middle">.9035</text>
    <text class="value" x="656" y="106" text-anchor="middle">.8899</text>
    <text class="group" x="626" y="425" text-anchor="middle">Order</text>
  </g>

  <g aria-label="Weighted">
    <rect class="candidate" x="770" y="145.7" width="52" height="254.3" rx="3"/>
    <rect class="ranker" x="830" y="154.7" width="52" height="245.3" rx="3"/>
    <text class="value" x="796" y="136" text-anchor="middle">.7948</text>
    <text class="value" x="856" y="145" text-anchor="middle">.7667</text>
    <text class="group" x="826" y="425" text-anchor="middle">Weighted</text>
  </g>

  <text class="note" x="495" y="466" text-anchor="middle">Candidate@100 是候选池覆盖上界；LambdaRank 将 100 个候选压缩为最终 Top20。</text>
</svg>
