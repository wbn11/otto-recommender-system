<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">候选预算与召回率</title>
  <desc id="desc">Candidate K 从 20 增加到 100 时，点击、加购、购买和加权候选召回率均持续提高。</desc>
  <style>
    :root { color-scheme: light dark; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #1f2328; }
    .title { font-size: 22px; font-weight: 600; }
    .subtitle, .axis, .note { fill: #59636e; }
    .subtitle { font-size: 13px; }
    .axis, .value, .legend, .note { font-size: 12px; }
    .grid { stroke: #d0d7de; stroke-width: 1; }
    .frame { stroke: #8c959f; stroke-width: 1.2; }
    .line { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .point { stroke-width: 2; }
    .click-stroke { stroke: #2563eb; } .click-fill { fill: #2563eb; }
    .cart-stroke { stroke: #f59e0b; } .cart-fill { fill: #f59e0b; }
    .order-stroke { stroke: #16a34a; } .order-fill { fill: #16a34a; }
    .weighted-stroke { stroke: #7c3aed; } .weighted-fill { fill: #7c3aed; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .subtitle, .axis, .note { fill: #9da7b3; }
      .grid { stroke: #30363d; }
      .frame { stroke: #6e7681; }
      .click-stroke { stroke: #60a5fa; } .click-fill { fill: #60a5fa; }
      .cart-stroke { stroke: #fbbf24; } .cart-fill { fill: #fbbf24; }
      .order-stroke { stroke: #4ade80; } .order-fill { fill: #4ade80; }
      .weighted-stroke { stroke: #a78bfa; } .weighted-fill { fill: #a78bfa; }
    }
  </style>

  <text class="title" x="70" y="38">候选预算 K 与 Candidate Recall</text>
  <text class="subtitle" x="70" y="61">同一份 Top100 产物按融合顺序截断，避免重复生成候选</text>

  <g class="legend" transform="translate(520 30)">
    <circle class="click-fill" cx="6" cy="7" r="5"/><text x="17" y="11">Click</text>
    <circle class="cart-fill" cx="82" cy="7" r="5"/><text x="93" y="11">Cart</text>
    <circle class="order-fill" cx="153" cy="7" r="5"/><text x="164" y="11">Order</text>
    <circle class="weighted-fill" cx="235" cy="7" r="5"/><text x="246" y="11">Weighted</text>
  </g>

  <g>
    <line class="grid" x1="90" y1="400" x2="900" y2="400"/>
    <line class="grid" x1="90" y1="336" x2="900" y2="336"/>
    <line class="grid" x1="90" y1="272" x2="900" y2="272"/>
    <line class="grid" x1="90" y1="208" x2="900" y2="208"/>
    <line class="grid" x1="90" y1="144" x2="900" y2="144"/>
    <line class="grid" x1="90" y1="80" x2="900" y2="80"/>
    <line class="frame" x1="90" y1="80" x2="90" y2="400"/>
    <line class="frame" x1="90" y1="400" x2="900" y2="400"/>
    <text class="axis" x="73" y="404" text-anchor="end">0.0</text>
    <text class="axis" x="73" y="340" text-anchor="end">0.2</text>
    <text class="axis" x="73" y="276" text-anchor="end">0.4</text>
    <text class="axis" x="73" y="212" text-anchor="end">0.6</text>
    <text class="axis" x="73" y="148" text-anchor="end">0.8</text>
    <text class="axis" x="73" y="84" text-anchor="end">1.0</text>
    <text class="axis" x="210" y="425" text-anchor="middle">20</text>
    <text class="axis" x="495" y="425" text-anchor="middle">50</text>
    <text class="axis" x="780" y="425" text-anchor="middle">100</text>
    <text class="axis" x="495" y="458" text-anchor="middle">每个 (session, target_type) 的候选预算 K</text>
  </g>

  <polyline class="line click-stroke" points="210,271.7 495,251.0 780,235.1"/>
  <polyline class="line cart-stroke" points="210,214.6 495,197.2 780,185.4"/>
  <polyline class="line order-stroke" points="210,151.1 495,124.5 780,110.9"/>
  <polyline class="line weighted-stroke" points="210,182.2 495,159.0 780,145.7"/>

  <g>
    <circle class="point click-fill click-stroke" cx="210" cy="271.7" r="6"/><circle class="point click-fill click-stroke" cx="495" cy="251.0" r="6"/><circle class="point click-fill click-stroke" cx="780" cy="235.1" r="6"/>
    <circle class="point cart-fill cart-stroke" cx="210" cy="214.6" r="6"/><circle class="point cart-fill cart-stroke" cx="495" cy="197.2" r="6"/><circle class="point cart-fill cart-stroke" cx="780" cy="185.4" r="6"/>
    <circle class="point order-fill order-stroke" cx="210" cy="151.1" r="6"/><circle class="point order-fill order-stroke" cx="495" cy="124.5" r="6"/><circle class="point order-fill order-stroke" cx="780" cy="110.9" r="6"/>
    <circle class="point weighted-fill weighted-stroke" cx="210" cy="182.2" r="6"/><circle class="point weighted-fill weighted-stroke" cx="495" cy="159.0" r="6"/><circle class="point weighted-fill weighted-stroke" cx="780" cy="145.7" r="6"/>
  </g>

  <g class="value">
    <text x="225" y="287">.4011</text><text x="510" y="266">.4656</text><text x="795" y="250">.5154</text>
    <text x="225" y="226">.5794</text><text x="510" y="209">.6336</text><text x="795" y="197">.6707</text>
    <text x="225" y="143">.7779</text><text x="510" y="116">.8609</text><text x="795" y="102">.9035</text>
    <text x="225" y="178">.6807</text><text x="510" y="155">.7532</text><text x="795" y="142">.7948</text>
  </g>
</svg>
